      security: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
        example: http://localhost:5173
        description: Must match configured CORS_ORIGIN. Browser sets this automatically.
  /api/auth/me:
    get:
      tags:
      - Authentication
      summary: Current user
      operationId: get_api_auth_me
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example: *id001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: INTERNAL_ERROR
                    message: Internal server error
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '401':
          description: Sign in required / Session expired or invalid / Invalid session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: UNAUTHORIZED
                    message: Sign in required
                    requestId: 00000000-0000-4000-8000-000000000001
                '1':
                  value:
                    status: error
                    code: UNAUTHORIZED
                    message: Session expired or invalid
