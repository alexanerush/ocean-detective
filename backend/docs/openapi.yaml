components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: od_session
  schemas:
    Error:
      type: object
      required:
      - status
      - code
      - message
      - requestId
      properties:
        status:
          type: string
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
    SampleAnalysis:
      type: object
      required:
      - status
      - message
      - analysis
      - output
      properties:
        status:
          type: string
        message:
          type: string
        analysis:
          type: object
          required:
          - image
          - marine_debris_pixels
          - classes
          - confidence
          properties:
            image:
              type: object
              required:
              - width
              - height
              - bands
              - crs
              properties:
                width:
                  type: integer
                height:
                  type: integer
                bands:
                  type: integer
                crs:
                  type: string
            marine_debris_pixels:
              type: integer
            classes: &id005
              type: object
              additionalProperties:
                type: integer
                minimum: 0
            confidence: *id005
        output:
          type: string
    ModelComparison:
      type: object
      required:
      - status
      - experiment
      - results
      - visualization
      properties:
        status:
          type: string
        experiment:
          type: object
          required:
          - name
          - dataset
          - split
          - target_class
          properties:
            name:
              type: string
            dataset:
              type: string
            split:
