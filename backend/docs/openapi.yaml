openapi: 3.0.3
info:
  title: Ocean Detective API
  version: 1.0.0
  description: Marine debris research and authenticated satellite image analysis.
    Examples are illustrative except recorded research and inference results. Protected
    requests use a session cookie. Write requests require the configured frontend
    Origin.
servers:
- url: http://localhost:3000
paths:
  /:
    get:
      tags:
      - Service
      summary: Service information
      operationId: get_root
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - project
                - message
                properties:
                  project:
                    type: string
                  message:
                    type: string
              example:
                project: Ocean Detective
                message: Backend API is running
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: INTERNAL_ERROR
                    message: Internal server error
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
      security: []
      parameters: []
  /api/health:
    get:
      tags:
      - Service
      summary: Database health
      operationId: get_api_health
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - service
                - database
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  database:
                    type: string
              example:
                status: ok
                service: ocean-detective-backend
                database: connected
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: INTERNAL_ERROR
                    message: Internal server error
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '503':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                  message:
                    type: string
              example:
                status: error
                message: Database unavailable
      security: []
      parameters: []
  /api/analyze:
    post:
      tags:
      - Research
      summary: Inspect bundled MARIDA sample (not user inference)
      operationId: post_api_analyze
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleAnalysis'
              example:
                status: success
                message: Satellite image analysis completed
                analysis:
                  image:
                    width: 256
                    height: 256
                    bands: 11
                    crs: EPSG:32618
                  marine_debris_pixels: 27
                  classes:
                    '0': 65332
                    '1': 27
                    '5': 32
                    '7': 76
                    '11': 67
                    '15': 2
                  confidence:
                    '0': 65332
                    '1': 185
                    '2': 11
                    '3': 8
                output: Example console output
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: INTERNAL_ERROR
                    message: Internal server error
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '400':
          description: Invalid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: INVALID_REQUEST
                    message: Invalid JSON
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: INVALID_REQUEST
                    message: Request too large
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '409':
          description: Sample analysis already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: SAMPLE_BUSY
                    message: Sample analysis already running
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
      security: []
      parameters: []
  /api/model-comparison:
    get:
      tags:
      - Research
      summary: Read validation experiment
      operationId: get_api_model_comparison
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelComparison'
              example:
                status: success
                experiment:
                  name: RGB vs Multispectral Random Forest
                  dataset: MARIDA
                  split: validation
                  target_class: Marine Debris
                results:
                  experiment: RGB vs multispectral Random Forest
                  dataset: MARIDA
                  split:
                    train_patches: 694
                    validation_patches: 328
                    test_patches: 359
                    test_used: false
                  features:
                    rgb:
                    - B02
                    - B03
                    - B04
                    multispectral:
                    - B01
                    - B02
                    - B03
                    - B04
                    - B05
                    - B06
                    - B07
                    - B08
                    - B8A
                    - B11
                    - B12
                  random_forest:
                    n_estimators: 100
                    max_depth: 20
                    min_samples_leaf: 2
                    class_weight: balanced
                    random_state: 42
                    n_jobs: -1
                  validation:
                    rgb:
                      precision: 0.10124610591900311
                      recall: 0.12093023255813953
                      f1: 0.11021619330224672
                      iou: 0.05832211754149843
                      true_positive: 130
                      false_positive: 1154
                      false_negative: 945
                      training_seconds: 9.01452898979187
                    multispectral:
                      precision: 0.8046471600688468
                      recall: 0.8697674418604651
                      f1: 0.8359409924005364
                      iou: 0.7181259600614439
                      true_positive: 935
                      false_positive: 227
                      false_negative: 140
                      training_seconds: 16.855019092559814
                visualization: /results/validation_model_comparison.png
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: INTERNAL_ERROR
                    message: Internal server error
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
      security: []
      parameters: []
  /api/auth/register:
    post:
      tags:
      - Authentication
      summary: Register
      operationId: post_api_auth_register
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example: &id001
                user:
                  id: '1'
                  email: developer@example.com
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
            Set-Cookie:
              schema:
                type: string
              description: od_session JWT, HttpOnly, SameSite=Lax, Path=/api, lifetime
                one hour; Secure in production
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: INTERNAL_ERROR
                    message: Internal server error
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '403':
          description: Origin not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: ORIGIN_DENIED
                    message: Origin not allowed
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '400':
          description: Invalid JSON / Email and password are required / Enter a valid
            email and a password of 12–128 characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: INVALID_REQUEST
                    message: Invalid JSON
                    requestId: 00000000-0000-4000-8000-000000000001
                '1':
                  value:
                    status: error
                    code: INVALID_INPUT
                    message: Email and password are required
                    requestId: 00000000-0000-4000-8000-000000000001
                '2':
                  value:
                    status: error
                    code: INVALID_INPUT
                    message: Enter a valid email and a password of 12–128 characters
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: INVALID_REQUEST
                    message: Request too large
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '429':
          description: Too many attempts. Try again later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: RATE_LIMIT
                    message: Too many attempts. Try again later.
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: EMAIL_EXISTS
                    message: Email already registered
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
      security: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
        example: http://localhost:5173
        description: Must match configured CORS_ORIGIN. Browser sets this automatically.
      requestBody: &id002
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                  format: password
            example:
              email: developer@example.com
              password: <your-local-password>
  /api/auth/login:
