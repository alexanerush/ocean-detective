              examples:
                '0':
                  value:
                    status: error
                    code: ORIGIN_DENIED
                    message: Origin not allowed
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '400':
          description: Invalid JSON / Email and password are required / Enter a valid
            email and a password of 12–128 characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: INVALID_REQUEST
                    message: Invalid JSON
                    requestId: 00000000-0000-4000-8000-000000000001
                '1':
                  value:
                    status: error
                    code: INVALID_INPUT
                    message: Email and password are required
                    requestId: 00000000-0000-4000-8000-000000000001
                '2':
                  value:
                    status: error
                    code: INVALID_INPUT
                    message: Enter a valid email and a password of 12–128 characters
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: INVALID_REQUEST
                    message: Request too large
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '429':
          description: Too many attempts. Try again later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: RATE_LIMIT
                    message: Too many attempts. Try again later.
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: INVALID_CREDENTIALS
                    message: Invalid email or password
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
      security: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
        example: http://localhost:5173
        description: Must match configured CORS_ORIGIN. Browser sets this automatically.
      requestBody: *id002
  /api/auth/logout:
    post:
      tags:
      - Authentication
      summary: Clear session cookie
      operationId: post_api_auth_logout
      responses:
        '204':
          description: No content
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
            Set-Cookie:
              schema:
                type: string
              description: Clears od_session
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: INTERNAL_ERROR
                    message: Internal server error
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '403':
          description: Origin not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: ORIGIN_DENIED
                    message: Origin not allowed
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '400':
          description: Invalid JSON
          content:
            application/json:
              schema:
