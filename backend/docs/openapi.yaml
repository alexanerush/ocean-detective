                    status: error
                    code: UNAUTHORIZED
                    message: Invalid session
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
      security:
      - session: []
      parameters: []
  /api/images:
    post:
      tags:
      - Images
      summary: Upload GeoTIFF
      operationId: post_api_images
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - image
                properties:
                  image:
                    $ref: '#/components/schemas/SatelliteImage'
              example:
                image: &id003
                  image_id: '1'
                  original_filename: sample.tif
                  file_size_bytes: '2883584'
                  width_pixels: 256
                  height_pixels: 256
                  band_count: 11
                  uploaded_at: '2026-01-01T12:00:00Z'
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: INTERNAL_ERROR
                    message: Internal server error
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '401':
          description: Sign in required / Session expired or invalid / Invalid session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: UNAUTHORIZED
                    message: Sign in required
                    requestId: 00000000-0000-4000-8000-000000000001
                '1':
                  value:
                    status: error
                    code: UNAUTHORIZED
                    message: Session expired or invalid
                    requestId: 00000000-0000-4000-8000-000000000001
                '2':
                  value:
                    status: error
                    code: UNAUTHORIZED
                    message: Invalid session
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '403':
          description: Origin not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: ORIGIN_DENIED
                    message: Origin not allowed
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '400':
          description: Invalid upload or file exceeds 25 MiB / Select an image / Invalid
            JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: UPLOAD_ERROR
                    message: Invalid upload or file exceeds 25 MiB
                    requestId: 00000000-0000-4000-8000-000000000001
                '1':
                  value:
                    status: error
                    code: FILE_REQUIRED
                    message: Select an image
                    requestId: 00000000-0000-4000-8000-000000000001
                '2':
                  value:
                    status: error
                    code: INVALID_REQUEST
                    message: Invalid JSON
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '413':
          description: Invalid upload or file exceeds 25 MiB / Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: UPLOAD_ERROR
                    message: Invalid upload or file exceeds 25 MiB
                    requestId: 00000000-0000-4000-8000-000000000001
                '1':
                  value:
                    status: error
                    code: INVALID_REQUEST
                    message: Request too large
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '415':
          description: Only nonempty GeoTIFF files are accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: INVALID_FILE
                    message: Only nonempty GeoTIFF files are accepted
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '422':
          description: Invalid GeoTIFF or raster exceeds limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                '0':
                  value:
                    status: error
                    code: INVALID_RASTER
                    message: Invalid GeoTIFF or raster exceeds limits
                    requestId: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
              description: Request correlation identifier
        '503':
          description: Raster validation unavailable
